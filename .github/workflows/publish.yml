name: Publish

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  nuget:
    runs-on: ubuntu-latest
    environment: production
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0 # All history to ensure proper tagging.

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: | 
          11.0.x
          10.0.x
          9.0.x

    - name: Build & Pack
      run: ./build/run.sh pack
        
    - name: NuGet Login
      id: login
      uses: nuget/login@v1
      with:
        user: Werecodent
      
    - name: NuGet Publish
      run: >-
        dotnet nuget push ./artifacts/releases/*.nupkg
        --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
        --source https://api.nuget.org/v3/index.json
